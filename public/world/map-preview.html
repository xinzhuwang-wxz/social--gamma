<!doctype html>
<!-- 临时预览页：单独查看 OSM 生成的紫金港底图质量（不进入正式页面，验证后可删） -->
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>campus-map 预览</title>
<style>
  body { margin: 0; background: #e8e4d7; display: grid; place-items: center; min-height: 100vh; }
  #wrap { width: 400px; height: 780px; overflow: hidden; border: 6px solid #f8f1df; border-radius: 30px; background: #f4efdc; }
  svg { width: 100%; height: 100%; }
  text { font-family: "Songti SC", serif; font-size: 12px; fill: #8b8266; text-anchor: middle; paint-order: stroke; stroke: rgba(250,245,224,.9); stroke-width: 3px; }
</style></head>
<body>
<div id="wrap"></div>
<script src="campus-map.js"></script>
<script>
const cm = window.CampusMap;
const svgNS = "http://www.w3.org/2000/svg";
const svg = document.createElementNS(svgNS, "svg");
svg.setAttribute("viewBox", cm.viewBox.join(" "));
const add = (tag, attrs, parent = svg) => { const el = document.createElementNS(svgNS, tag); for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v); parent.appendChild(el); return el; };
add("rect", { x:-50, y:-50, width:cm.viewBox[2]+100, height:cm.viewBox[3]+100, fill:"#f4efdc" });
for (const d of cm.layers.green) add("path", { d, fill:"#dde3b1" });
for (const d of cm.layers.pitches) add("path", { d, fill:"#cdd98b", stroke:"#b9c775" });
for (const d of cm.layers.rivers) add("path", { d, fill:"none", stroke:"#aed6e5", "stroke-width":7, "stroke-linecap":"round" });
for (const d of cm.layers.water) add("path", { d, fill:"#a8d3e4", stroke:"#8cc3d8", "stroke-width":2 });
for (const r of cm.layers.roads) add("path", { d:r.d, fill:"none", stroke:r.major?"#e7d9b4":"#f7efd7", "stroke-width":r.major?11:7, "stroke-linecap":"round" });
for (const d of cm.layers.paths) add("path", { d, fill:"none", stroke:"#e3d6ae", "stroke-width":2.2, "stroke-dasharray":"7 6" });
for (const d of cm.layers.buildings) add("path", { d, fill:"#efe4c6", stroke:"#c9b585", "stroke-width":1.4 });
for (const l of cm.labels) { const t = add("text", { x:l.x, y:l.y }); t.textContent = l.name; }
for (const [id, a] of Object.entries(cm.spotAnchors)) {
  if (!a) continue;
  add("circle", { cx:a[0], cy:a[1], r:10, fill:"rgba(216,97,62,.75)" });
  const t = add("text", { x:a[0], y:a[1]-14 }); t.textContent = id; t.style.fill = "#d8613e";
}
document.getElementById("wrap").appendChild(svg);
</script>
</body></html>
